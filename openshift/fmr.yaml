apiVersion: apps/v1
kind: Deployment
metadata:
  name: fmr
  labels:
    app.kubernetes.io/part-of: suptech-xai
    app: fmr
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"suptech-xai:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"fmr\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fmr
  template:
    metadata:
      labels:
        app: fmr
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fmr
          image: suptech-xai:latest
          command: ["uvicorn", "metadata_registry.fmr_mock_api:app",
                    "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: suptech-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: fmr
  labels:
    app.kubernetes.io/part-of: suptech-xai
spec:
  selector:
    app: fmr
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fmr
  labels:
    app.kubernetes.io/part-of: suptech-xai
spec:
  to:
    kind: Service
    name: fmr
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
